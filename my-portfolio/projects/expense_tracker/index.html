<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Smart Expense Tracker</h1>
        <p class="subtitle">Track your spending simply</p>
      </header>

      <!-- Filters -->
      <div class="filters">
        <button data-filter="all">All</button>
        <button data-filter="day">Today</button>
        <button data-filter="week">This Week</button>
        <button data-filter="month">This Month</button>
      </div>

      <!-- Add Expense -->
      <section class="card">
        <h2>Add Expense</h2>
        <form id="expense-form">
          <input type="text" id="name" placeholder="Expense name" />
          <input type="number" id="amount" placeholder="Amount" step="0.01" />
          <input type="date" id="date" />
          <select id="category">
            <option value="">Select category</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Other</option>
          </select>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <!-- Expense List -->
      <section class="card">
        <h2>Expenses</h2>
        <ul id="expense-list"></ul>
        <p id="empty-state">No expenses yet. Add your first one.</p>
      </section>

      <!-- Total -->
      <section class="card total">
        <p>Total Spending</p>
        <h2 id="total">$0.00</h2>
      </section>

      <footer class="footer">
        <p>
          &copy; <span id="year"></span> Jaisal Brar •
          <a
            href="https://github.com/brarjaisal/"
            target="_blank"
            rel="noopener noreferrer"
          >
            github
          </a>
        </p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
